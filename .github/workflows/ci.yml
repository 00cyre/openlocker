name: Check OpenLocker
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: openlocker-source
          path: dist/openlocker-*.zip
  mac-helper:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build-native.sh
      - run: python3 tests/native_protocol.py
