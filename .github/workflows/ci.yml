name: Check OpenLocker
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: openlocker-source
          path: dist/OpenLocker-*-source.zip
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-mac-app.sh
      - run: bash scripts/build-installer.sh
      - run: bash scripts/test-installer.sh
      - run: python3 tests/native_protocol.py
      - uses: actions/upload-artifact@v4
        with:
          name: openlocker-macos
          path: |
            dist/OpenLocker-*-macOS.dmg
            dist/OpenLocker-*-macOS.zip
            dist/SHA256SUMS.txt
