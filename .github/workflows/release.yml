name: Release OpenLocker
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release'
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      OPENLOCKER_RELEASE: '1'
      OPENLOCKER_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify version and signing configuration
        env:
          SIGNING_P12: ${{ secrets.OPENLOCKER_SIGNING_P12 }}
        run: |
          echo "OPENLOCKER_SIGNING_KEYCHAIN=$RUNNER_TEMP/openlocker-release.keychain-db" >> "$GITHUB_ENV"
          test -n "$SIGNING_P12" || { echo 'Persistent release signing identity is missing.'; exit 1; }
          test "$OPENLOCKER_TAG" = "v$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')"
          OPENLOCKER_ROOT="$PWD"
          source scripts/signing.sh
          echo "OPENLOCKER_SIGNING_IDENTITY=$(openlocker_release_fingerprint)" >> "$GITHUB_ENV"
      - name: Import persistent signing identity
        env:
          OPENLOCKER_SIGNING_P12: ${{ secrets.OPENLOCKER_SIGNING_P12 }}
          OPENLOCKER_SIGNING_PASSWORD: ${{ secrets.OPENLOCKER_SIGNING_PASSWORD }}
        run: |
          python3 scripts/import-release-signing.py
          # This disposable runner must resolve the imported signing identity.
          # This never changes certificate trust or keychains on a user's Mac.
          security list-keychains -d user -s "$OPENLOCKER_SIGNING_KEYCHAIN"
          security find-identity -p codesigning "$OPENLOCKER_SIGNING_KEYCHAIN"
      - run: npm test && npm run check && npm run test:mac
      - run: npm run build:release
      - run: npm run test:installer && npm run test:native && npm run package
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')"
          shasum -a 256 "dist/OpenLocker-$VERSION-source.zip" | sed 's|dist/||' >> dist/SHA256SUMS.txt
          gh release create "$OPENLOCKER_TAG" --verify-tag --title "OpenLocker $VERSION" --notes-file "docs/releases/$VERSION.md" --latest \
            "dist/OpenLocker-$VERSION-macOS.dmg" "dist/OpenLocker-$VERSION-macOS.zip" \
            "dist/OpenLocker-$VERSION-source.zip" dist/SHA256SUMS.txt
      - name: Remove release keychain
        if: always()
        run: security delete-keychain "${OPENLOCKER_SIGNING_KEYCHAIN:-$RUNNER_TEMP/openlocker-release.keychain-db}" || true
