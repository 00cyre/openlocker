<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
<title id="title">OpenLocker — private apps, private tabs</title><desc id="desc">A Touch ID privacy lock for Mac apps and Chrome websites. Illustration of the menu bar and lock screen.</desc>
