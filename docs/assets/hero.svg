<text x="113" y="83" fill="#263c28" font-size="26" font-weight="700" letter-spacing="-1">openlocker</text>
<text x="62" y="193" fill="#7b836f" font-size="12" letter-spacing="2.5" font-weight="700">A LITTLE PRIVACY, AT YOUR FINGERTIPS.</text>
<text x="58" y="270" fill="#263c28" font-size="68" font-weight="700" letter-spacing="-3">Private apps.</text>
<text x="58" y="344" fill="#263c28" font-size="68" font-weight="700" letter-spacing="-3">Private tabs.</text>
<text x="62" y="397" fill="#737b69" font-size="21">Your Mac. Your fingerprint. Your space.</text>
