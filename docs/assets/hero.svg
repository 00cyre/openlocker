<rect x="183" y="443" width="122" height="34" rx="17" fill="#e5ecd9"/><text x="244" y="465" text-anchor="middle" fill="#526943" font-size="12" font-weight="600">LOCAL ONLY</text>
<text x="62" y="548" fill="#87907b" font-size="12" letter-spacing="1.5">MACOS + CHROME · OPEN SOURCE</text>
